name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, checksum, publish
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          PKG_V="$(node -p "require('./package.json').version")"
          if [ "$V" != "$PKG_V" ]; then
            echo "Tag/dispatch version ($V) does not match package.json ($PKG_V)" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build
        run: npm run build

      - name: Package NSIS installer
        run: npx electron-builder --win --publish never

      - name: Validate & checksum
        shell: bash
        run: node scripts/validate-dist.mjs

      - name: Upload workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: dentiva-pro-v${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish to GitHub Release
        id: publish
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          NOTES="Dentiva Pro v${{ steps.ver.outputs.version }} — offline dental clinic management for Windows.
          Verify downloads against SHA256SUMS.txt."
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Dentiva Pro $TAG" --notes "$NOTES" \
              dist/*.exe dist/SHA256SUMS.txt || exit 1
          else
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/*.exe dist/SHA256SUMS.txt || exit 1
          fi

      - name: Fallback — commit artifacts to repo dist/
        if: steps.publish.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/release-artifacts-clone"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q -b release-artifacts "$WORK"
          cd "$WORK"
          git remote add origin "$URL"
          if git fetch -q origin release-artifacts; then
            git reset -q --soft origin/release-artifacts
          fi
          mkdir -p dist
          cp "$GITHUB_WORKSPACE"/dist/*.exe "$GITHUB_WORKSPACE"/dist/SHA256SUMS.txt dist/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi
          git commit -m "chore(release): v${{ steps.ver.outputs.version }} installer (publish fallback)"
          git push -q origin release-artifacts
