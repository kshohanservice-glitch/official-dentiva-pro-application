name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows · typecheck, lint, test, package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Build (electron-vite)
        run: npm run build

      - name: Package NSIS installer
        run: npx electron-builder --win --publish never

      - name: Validate artifacts
        shell: bash
        run: node scripts/validate-dist.mjs

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: dentiva-pro-windows-installer
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
